name: 'Lint'
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - 'main'
jobs:
  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout the current branch'
        uses: 'actions/checkout@v6'
      - name: 'Setup Node'
        uses: 'actions/setup-node@v6'
        with:
          node-version: 24
      - name: 'Install Node modules'
        run: 'npm ci'
      - name: 'Run lint'
        run: 'npm run lint'
